<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fluxograma - Projeto Ártemis</title>

    <!-- icone guia -->
    <link rel="shortcut icon" href="img/logo Artemis.png" type="image/x-icon">
    <link rel="icon" href="img/logo Artemis.png" type="image/x-icon">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/fluxograma.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="flowchart-page">

        <div class="flowchart-topbar">

            <a href="index.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
                Voltar ao Projeto
            </a>

            <div class="flowchart-tools">

                <button id="zoomOut">
                    <i class="fa-solid fa-minus"></i>
                </button>

                <span id="zoomValue">100%</span>

                <button id="zoomIn">
                    <i class="fa-solid fa-plus"></i>
                </button>

                <button id="zoomReset">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>

            </div>

        </div>

        <div class="flowchart-container">

            <img src="img/diagrama site.png" alt="Fluxograma Artemis" id="flowchartImage">

        </div>

    </div>

    <script src="js/fluxograma.js"></script>

</body>

</html>
